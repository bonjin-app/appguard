[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "appguard-reference"
version = "0.0.0"
description = "Experimental AppGuard typed-input protocol reference; not a production SDK"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["appguard-server==0.1.0.dev0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
require-build-hashes = true
build-constraint-dependencies = [
    { requirement = "hatchling==1.27.0", hashes = ["sha256:d3a2f3567c4f926ea39849cdf924c7e99e6686c9c8e288ae1037c8fa2a5d937b"] },
    { requirement = "packaging==25.0", hashes = ["sha256:29572ef2b1f17581046b3a2227d5c611fb25ec70ca1ba8554b24b0e69331a484"] },
    { requirement = "pathspec==0.12.1", hashes = ["sha256:a0d503e138a4c123b27490a4f7beda6a01c6f288df0e4a8b79c7eb0dc7b4cc08"] },
    { requirement = "pluggy==1.6.0", hashes = ["sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746"] },
    { requirement = "trove-classifiers==2025.5.9.12", hashes = ["sha256:e381c05537adac78881c8fa345fd0e9970159f4e4a04fcc42cfd3129cca640ce"] },
]
package = true
prerelease = "disallow"

[tool.hatch.build.targets.wheel]
packages = ["src/appguard_reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.uv.sources]
appguard-server = { path = "../../sdk/python", editable = true }
