name: Unpublished release candidate readiness

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Release tooling safety tests
        run: python3 -m unittest discover -s scripts/release/tests -v
      - name: Clean tracked candidate, hashes and dependency coverage
        run: python3 scripts/release/candidate.py --output "$RUNNER_TEMP/appguard-candidate"
      - name: Source SBOM, vulnerability, secret and license checks
        run: python3 scripts/release/scan.py --candidate "$RUNNER_TEMP/appguard-candidate" --output "$RUNNER_TEMP/appguard-scans"
      - name: Stage privacy-bounded artifacts after complete evidence verification
        if: always()
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release/publication_gate.py --candidate "$RUNNER_TEMP/appguard-candidate" --scans "$RUNNER_TEMP/appguard-scans" --output "$RUNNER_TEMP/appguard-publication" --expected-commit "$CANDIDATE_COMMIT"
      - name: Assess technical and external readiness gates separately
        if: always()
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release/assess.py --candidate "$RUNNER_TEMP/appguard-candidate" --scans "$RUNNER_TEMP/appguard-scans" --output "$RUNNER_TEMP/appguard-assessment" --expected-commit "$CANDIDATE_COMMIT"
      - name: Retain gated evidence or sanitized denial status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpublished-candidate-${{ github.sha }}
          # Contents require all eight verified checks, source/runtime coverage and zero security findings.
          # Failure staging contains public-status.json only: fixed booleans/codes and opaque hashes.
          path: ${{ runner.temp }}/appguard-publication
          if-no-files-found: warn
          retention-days: 7
      - name: Retain fixed-schema readiness assessment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readiness-assessment-${{ github.sha }}
          path: ${{ runner.temp }}/appguard-assessment/assessment.json
          if-no-files-found: warn
          retention-days: 7
