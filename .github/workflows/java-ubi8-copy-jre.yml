name: UBI8 copy-only JRE diagnostic

on:
  push:
    branches: [codex/ubi8-copy-jre-evaluation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ubi8-copy-jre-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    name: Diagnose UBI8 copy-only JRE ${{ matrix.arch }} on selected host
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fixed diagnostic contracts
        run: |
          python3 -m unittest discover -s .github/tests -p 'test_java_runtime_rpm.py' -v
          python3 -m unittest discover -s .github/tests -p 'test_java_runtime_inventory.py' -v
          python3 -m unittest discover -s .github/tests -p 'test_java_ubi_evidence.py' -v
          python3 -m unittest discover -s .github/tests -p 'test_java_ubi_workflow.py' -v
          python3 -m unittest discover -s .github/tests -p 'test_java_ubi8_copy_jre.py' -v
          python3 -m unittest discover -s .github/tests -p 'test_java_ubi8_workflow.py' -v
      - name: Prepare private diagnostic state
        id: state
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH:$(uname -s):$(uname -m)" in
            amd64:Linux:x86_64|arm64:Linux:aarch64) ;; *) exit 2 ;;
          esac
          umask 077
          state="$RUNNER_TEMP/appguard-ubi8-copy-jre-comparison"
          mkdir -m 700 "$state"
          mkdir -m 700 "$state/native"
      - name: Build two fixed untouched-JRE diagnostics
        id: images
        timeout-minutes: 10
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          umask 077
          state="$RUNNER_TEMP/appguard-ubi8-copy-jre-comparison"
          owner="appguard-ubi8-copy-jre-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$APPGUARD_ARCH"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/qualification')
          from spring_containers import Docker
          Docker('docker', 'default', {})  # local socket and local docker-driver builder
          PY
          # Private build logs are bounded and are never uploaded.
          ulimit -f 8192
          for runtime in noble ubi; do
            target=baseline
            if [[ "$runtime" == ubi ]]; then target=ubi8-copy-jre; fi
            timeout 600 env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
              -u BUILDKIT_HOST -u BUILDX_BUILDER -u DOCKER_BUILDKIT \
              docker --context default build --builder default --pull --platform "linux/$APPGUARD_ARCH" \
              --file scripts/qualification/java-runtime-probe.Dockerfile --target "$target" \
              --label "io.appguard.ubi8-copy-jre-diagnostic=$owner" --tag "$owner-$runtime:owned" . \
              > "$state/build-$runtime.log" 2>&1
            timeout 10 docker --context default image inspect --format '{{.Id}}' "$owner-$runtime:owned" > "$state/$runtime-id"
          done
      - name: Collect independent feature and inventory observations
        id: native
        timeout-minutes: 23
        if: always() && steps.images.outcome == 'success'
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          umask 077
          state="$RUNNER_TEMP/appguard-ubi8-copy-jre-comparison"
          failed=0
          for runtime in noble ubi; do
            set --
            if [[ "$runtime" == ubi ]]; then set -- --package-profile rpm-ubi8-copy-jre-v1; fi
            image="$(cat "$state/$runtime-id")"
            set +e
            timeout 670 python3 scripts/qualification/inspect_java_runtime.py \
              --image "$image" --platform "linux/$APPGUARD_ARCH" --features "$@" \
              --docker-context default --output "$state/native/$runtime"
            result=$?
            set -e
            printf '%s\n' "$result" > "$state/native-$runtime-exit"
            if (( result > 1 )); then failed=2; elif (( result == 1 && failed == 0 )); then failed=1; fi
          done
          exit "$failed"
      - name: Scan same two IDs in one frozen database session
        id: scan
        timeout-minutes: 47
        if: always() && steps.images.outcome == 'success'
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          umask 077
          state="$RUNNER_TEMP/appguard-ubi8-copy-jre-comparison"
          noble="$(cat "$state/noble-id")"
          ubi="$(cat "$state/ubi-id")"
          set +e
          python3 scripts/qualification/scan_diagnostic_images.py \
            --image "$noble" --image "$ubi" --platform "linux/$APPGUARD_ARCH" \
            --docker-context default --output "$state/scan"
          result=$?
          set -e
          printf '%s\n' "$result" > "$state/scan-exit"
          # Preserve findings (exit1) and unverified UBI8 zero (exit2).
          exit "$result"
      - name: Bind originals without approving a production runtime
        id: bind
        timeout-minutes: 2
        if: always() && steps.images.outcome == 'success'
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          umask 077
          state="$RUNNER_TEMP/appguard-ubi8-copy-jre-comparison"
          noble="$(cat "$state/noble-id")"
          ubi="$(cat "$state/ubi-id")"
          set +e
          python3 scripts/qualification/compare_java_ubi_evidence.py \
            --input "$state" --output "$state/bound" --noble-image "$noble" --ubi-image "$ubi" \
            --platform "linux/$APPGUARD_ARCH" \
            --ubi-profile rpm-ubi8-copy-jre-v1 \
            --ubi-base-index sha256:c851eaf99ddf32811fdf8a216c2609cd0e55317ab8c46ecbaa3ea8298532f055 \
            --jre-source-index sha256:07fa0356cf354c5252947575f42ed42aa6fd921f36438b7bc77ad81c31c537dd
          result=$?
          set -e
          printf '%s\n' "$result" > "$state/bind-exit"
          exit "$result"
      - name: Remove only images with this run ownership and exact ID
        id: cleanup
        timeout-minutes: 2
        if: always() && steps.state.outcome == 'success'
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          umask 077
          state="$RUNNER_TEMP/appguard-ubi8-copy-jre-comparison"
          owner="appguard-ubi8-copy-jre-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$APPGUARD_ARCH"
          failed=0
          for runtime in noble ubi; do
            if [[ -f "$state/$runtime-id" ]]; then
              image="$(cat "$state/$runtime-id")"
            else
              # A build can finish just before its client fails. Discover only
              # this run's exact tag, then require the same ownership label.
              image="$(timeout 10 docker --context default image inspect --format '{{.Id}}' "$owner-$runtime:owned" 2>/dev/null)" || continue
            fi
            if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then failed=2; continue; fi
            actual="$(timeout 10 docker --context default image inspect --format '{{index .Config.Labels "io.appguard.ubi8-copy-jre-diagnostic"}}' "$image")" || { failed=2; continue; }
            if [[ "$actual" != "$owner" ]]; then failed=2; continue; fi
            timeout 15 docker --context default image rm "$image" > /dev/null || failed=2
          done
          remaining="$(timeout 10 docker --context default image ls --quiet --no-trunc --filter "label=io.appguard.ubi8-copy-jre-diagnostic=$owner")" || failed=2
          if [[ -n "$remaining" ]]; then failed=2; fi
          exit "$failed"
      - name: Record fixed diagnostic outcomes
        timeout-minutes: 1
        if: always() && steps.state.outcome == 'success'
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
          APPGUARD_IMAGES: ${{ steps.images.outcome }}
          APPGUARD_NATIVE: ${{ steps.native.outcome }}
          APPGUARD_SCAN: ${{ steps.scan.outcome }}
          APPGUARD_BIND: ${{ steps.bind.outcome }}
          APPGUARD_CLEANUP: ${{ steps.cleanup.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/qualification')
          from java_runtime_dependencies import private_publication, check_private_parent
          from scan_container_images import _path, file_identity, verify_files
          try:
              def require(value):
                  if not value: raise ValueError('diagnostic_status_unverified')
              arch=os.environ['APPGUARD_ARCH'];require(arch in ('amd64','arm64'))
              commit=os.environ['GITHUB_SHA'];require(re.fullmatch('[0-9a-f]{40}',commit))
              numbers={}
              for key in ('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT'):
                  raw=os.environ[key];require(re.fullmatch('[1-9][0-9]{0,19}',raw));numbers[key]=int(raw)
              state=_path(Path(os.environ['RUNNER_TEMP'])/'appguard-ubi8-copy-jre-comparison',directory=True)
              outcomes={key:os.environ['APPGUARD_'+key.upper()] for key in ('images','native','scan','bind','cleanup')}
              require(all(value in ('success','failure','cancelled','skipped') for value in outcomes.values()))
              pins={}
              def read(name,pattern):
                  path=state/name
                  if not path.exists(): return None
                  pin,raw=file_identity(path,128,keep=True);pins[path]=(128,pin)
                  value=raw.decode('ascii').strip();require(re.fullmatch(pattern,value));return value
              images={role:read(role+'-id',r'sha256:[0-9a-f]{64}') for role in ('noble','ubi')}
              native={role:read('native-'+role+'-exit',r'(?:0|[1-9][0-9]{0,2})') for role in ('noble','ubi')}
              exits={key:read(key+'-exit',r'(?:0|[1-9][0-9]{0,2})') for key in ('scan','bind')}
              for values in (native,exits):
                  for key,value in values.items():
                      require(value is None or int(value)<=255)
                      values[key]=None if value is None else int(value)
              require(images['noble'] is None or images['ubi'] is None or images['noble']!=images['ubi'])
              value=dict(schema=1,evidence_class='ubi8_copy_jre_diagnostic_run_status',source_commit=commit,
                  run_id=numbers['GITHUB_RUN_ID'],run_attempt=numbers['GITHUB_RUN_ATTEMPT'],architecture=arch,
                  package_profile='rpm-ubi8-copy-jre-v1',step_outcomes=outcomes,image_ids=images,
                  native_exit_codes=native,scan_exit_code=exits['scan'],binding_exit_code=exits['bind'],
                  release_ready=False,native_binary_coverage=False,coverage_complete=False,external_approval=False,
                  cpu_baseline_approved=False,legal_approval=False,complete_resolved_graph=False)
              with private_publication(state/'run-status') as publication:
                  publication.write('diagnostic-run-status.json',(json.dumps(value,sort_keys=True,allow_nan=False)+'\n').encode())
                  verify_files(pins);check_private_parent(publication);publication.publish()
                  verify_files(pins);check_private_parent(publication)
          except (Exception,KeyboardInterrupt):
              print('{"diagnostic_status_verified":false,"release_ready":false}')
              raise SystemExit(2)
          PY
      - name: Retain original diagnostic observations only
        timeout-minutes: 3
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-ubi8-copy-jre-diagnostic-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/native/noble/java-runtime.json
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/native/ubi/java-runtime.json
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/native/ubi/rpm-inventory.tsv
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/scan/diagnostic.json
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/scan/trivy-image-0.json
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/scan/trivy-image-1.json
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/scan/trivy-calibration.json
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/bound/comparison.json
            ${{ runner.temp }}/appguard-ubi8-copy-jre-comparison/run-status/diagnostic-run-status.json
          if-no-files-found: error
          retention-days: 7
