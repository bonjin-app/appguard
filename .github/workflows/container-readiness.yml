name: Container deployment readiness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Native owned-container architecture'
        type: choice
        options: [amd64, arm64]
        default: amd64
        required: true
      soak_seconds:
        description: 'Owned constrained-container soak duration (1..3600 seconds)'
        type: number
        default: 1800
        required: true
      soak_concurrency:
        description: 'Concurrent synthetic signed/replay workers (1..32)'
        type: number
        default: 8
        required: true

permissions:
  contents: read

concurrency:
  group: container-readiness-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.architecture || 'amd64' }}
  cancel-in-progress: true

jobs:
  owned-container-deployment:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Up to 60m traffic + 20m builds + 33m image scans, with setup/cleanup margin.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up pinned uv 0.13.4
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          enable-cache: false
      - name: Set up Temurin 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Frozen tooling and focused container safety tests
        run: |
          uv sync --locked --project sdk/python
          uv run --frozen --project sdk/python python .github/tests/test_spring_containers.py -v
          uv run --frozen --project sdk/python python .github/tests/test_spring_container_soak.py -v
          python3 .github/tests/test_container_image_scan.py -v
          python3 .github/tests/test_container_evidence_binding.py -v
          python3 .github/tests/test_container_workflow.py -v
          python3 .github/tests/test_container_platform.py -v
      - name: Build and exercise the owned container deployment
        env:
          # Inputs are data passed through quoted arguments, never shell source.
          APPGUARD_SOAK_SECONDS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.soak_seconds) || '30' }}
          APPGUARD_SOAK_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.soak_concurrency) || '8' }}
          APPGUARD_ARCHITECTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.architecture || 'amd64' }}
        run: |
          case "$APPGUARD_ARCHITECTURE" in amd64|arm64) ;; *) exit 1 ;; esac
          if ! [[ "$APPGUARD_SOAK_SECONDS" =~ ^[1-9][0-9]{0,3}$ ]] || (( APPGUARD_SOAK_SECONDS > 3600 )); then
            exit 1
          fi
          if ! [[ "$APPGUARD_SOAK_CONCURRENCY" =~ ^[1-9][0-9]?$ ]] || (( APPGUARD_SOAK_CONCURRENCY > 32 )); then
            exit 1
          fi
          uv run --frozen --project sdk/python python scripts/qualification/spring_containers.py \
            --docker-context default --java-home "$JAVA_HOME" \
            --platform "linux/$APPGUARD_ARCHITECTURE" \
            --soak-seconds "$APPGUARD_SOAK_SECONDS" --soak-concurrency "$APPGUARD_SOAK_CONCURRENCY" \
            --output "$RUNNER_TEMP/appguard-spring-containers"
      - name: Scan the exact runtime images without suppressions
        run: |
          python3 scripts/qualification/scan_container_images.py --receipt "$RUNNER_TEMP/appguard-spring-containers/receipt.json" --docker-context default --output "$RUNNER_TEMP/appguard-container-image-scans"
      - name: Prepare fixed-schema container evidence
        id: container_evidence
        if: always()
        env:
          APPGUARD_REPOSITORY: ${{ github.repository }}
          APPGUARD_COMMIT: ${{ github.sha }}
          APPGUARD_RUN_ID: ${{ github.run_id }}
          APPGUARD_RUN_ATTEMPT: ${{ github.run_attempt }}
          APPGUARD_EVENT: ${{ github.event_name }}
          APPGUARD_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          APPGUARD_WORKFLOW_PATH: .github/workflows/container-readiness.yml
        run: |
          mkdir -m 700 "$RUNNER_TEMP/appguard-private-container-evidence"
          python3 scripts/qualification/bind_container_evidence.py \
            --receipt "$RUNNER_TEMP/appguard-spring-containers/receipt.json" \
            --image-status "$RUNNER_TEMP/appguard-container-image-scans/status.json" \
            --output "$RUNNER_TEMP/appguard-private-container-evidence/bound" \
            --repository "$APPGUARD_REPOSITORY" --candidate-commit "$APPGUARD_COMMIT" \
            --run-id "$APPGUARD_RUN_ID" --run-attempt "$APPGUARD_RUN_ATTEMPT" \
            --event "$APPGUARD_EVENT" --head-branch "$APPGUARD_HEAD_BRANCH" \
            --workflow-path "$APPGUARD_WORKFLOW_PATH"
      - name: Retain fixed-schema operating and image status only
        if: always() && steps.container_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-container-readiness-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/appguard-private-container-evidence/bound/receipt.json
            ${{ runner.temp }}/appguard-private-container-evidence/bound/image-status.json
            ${{ runner.temp }}/appguard-private-container-evidence/bound/binding.json
          if-no-files-found: error
          retention-days: 7
