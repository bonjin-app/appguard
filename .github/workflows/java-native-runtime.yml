name: Java native runtime inventory

on:
  push:
    paths:
      - '.github/workflows/java-native-runtime.yml'
      - '.github/tests/test_java_runtime_inventory.py'
      - '.github/tests/test_java_runtime_dependencies.py'
      - '.github/tests/test_diagnostic_image_scan.py'
      - 'scripts/qualification/inspect_java_runtime.py'
      - 'scripts/qualification/spring_containers.py'
      - 'scripts/qualification/java-runtime-probe.Dockerfile'
      - 'scripts/qualification/java/AppGuardRuntimeProbe.java'
      - 'scripts/qualification/java-runtime-dependencies.lock'
      - 'scripts/qualification/install_java_runtime_dependencies.sh'
      - 'scripts/qualification/java_runtime_dependencies.py'
      - 'scripts/qualification/scan_diagnostic_images.py'
      - 'scripts/qualification/scan_container_images.py'
      - 'scripts/release/scan.py'
  pull_request:
    paths:
      - '.github/workflows/java-native-runtime.yml'
      - '.github/tests/test_java_runtime_inventory.py'
      - '.github/tests/test_java_runtime_dependencies.py'
      - '.github/tests/test_diagnostic_image_scan.py'
      - 'scripts/qualification/inspect_java_runtime.py'
      - 'scripts/qualification/spring_containers.py'
      - 'scripts/qualification/java-runtime-probe.Dockerfile'
      - 'scripts/qualification/java/AppGuardRuntimeProbe.java'
      - 'scripts/qualification/java-runtime-dependencies.lock'
      - 'scripts/qualification/install_java_runtime_dependencies.sh'
      - 'scripts/qualification/java_runtime_dependencies.py'
      - 'scripts/qualification/scan_diagnostic_images.py'
      - 'scripts/qualification/scan_container_images.py'
      - 'scripts/release/scan.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-native-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect-native-linkage:
    name: Collect ${{ matrix.arch }} ${{ matrix.runtime }} linkage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        runtime: [baseline, debian-probe, debian-closure]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test strict inventory handling
        run: |
          python3 .github/tests/test_java_runtime_inventory.py -v
          python3 .github/tests/test_java_runtime_dependencies.py -v
      - name: Build or pull fixed diagnostic input
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
          APPGUARD_RUNTIME: ${{ matrix.runtime }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          case "$APPGUARD_RUNTIME" in baseline|debian-probe|debian-closure) ;; *) exit 2 ;; esac
          image='appguard-java-native-probe:owned'
          docker --context default build --platform "linux/$APPGUARD_ARCH" \
            --file scripts/qualification/java-runtime-probe.Dockerfile \
            --target "$APPGUARD_RUNTIME" --tag "$image" .
          docker --context default image inspect --format '{{.Id}}' "$image" > "$RUNNER_TEMP/appguard-java-image-id"
      - name: Collect complete inventory and retain unresolved dependencies
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
          APPGUARD_RUNTIME: ${{ matrix.runtime }}
        run: |
          set --
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          case "$APPGUARD_RUNTIME" in
            baseline|debian-probe) ;;
            debian-closure) set -- --dependency-closure ;;
            *) exit 2 ;;
          esac
          image_id="$(cat "$RUNNER_TEMP/appguard-java-image-id")"
          set +e
          python3 scripts/qualification/inspect_java_runtime.py \
            --image "$image_id" --platform "linux/$APPGUARD_ARCH" --docker-context default --features "$@" \
            --output "$RUNNER_TEMP/appguard-java-native"
          result=$?
          set -e
          # Exit 1 is a complete measurement containing unresolved native checks.
          # This diagnostic workflow never approves a replacement production image.
          if (( result > 1 )); then exit "$result"; fi
      - name: Retain sanitized native inventory only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-native-${{ matrix.arch }}-${{ matrix.runtime }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/appguard-java-native/java-runtime.json
          if-no-files-found: error
          retention-days: 7

  compare-image-findings:
    name: Compare ${{ matrix.arch }} diagnostic images
    runs-on: ${{ matrix.runner }}
    # The scanner's absolute session ceiling is 46 minutes; leave bounded
    # margin for image builds, native probes, file checks and artifact upload.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test diagnostic scanner safety
        run: python3 .github/tests/test_diagnostic_image_scan.py -v
      - name: Build fixed paired diagnostic images
        id: paired_images
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          for runtime in baseline debian-closure; do
            image="appguard-java-$runtime:owned"
            docker --context default build --platform "linux/$APPGUARD_ARCH" \
              --file scripts/qualification/java-runtime-probe.Dockerfile \
              --target "$runtime" --tag "$image" .
            docker --context default image inspect --format '{{.Id}}' "$image" > "$RUNNER_TEMP/appguard-java-$runtime-id"
          done
      - name: Prepare private diagnostic comparison state
        id: comparison_state
        run: |
          root="$RUNNER_TEMP/appguard-java-comparison"
          mkdir -m 700 "$root"
          mkdir -m 700 "$root/native"
      - name: Collect paired native evidence on exact image IDs
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          root="$RUNNER_TEMP/appguard-java-comparison"
          failed=0
          for runtime in baseline debian-closure; do
            image_id="$(cat "$RUNNER_TEMP/appguard-java-$runtime-id")"
            set --
            if [[ "$runtime" == debian-closure ]]; then set -- --dependency-closure; fi
            set +e
            python3 scripts/qualification/inspect_java_runtime.py \
              --image "$image_id" --platform "linux/$APPGUARD_ARCH" --docker-context default --features "$@" \
              --output "$root/native/$runtime"
            result=$?
            set -e
            if (( result > 1 )); then failed=2; fi
          done
          exit "$failed"
      - name: Scan paired exact images with one database session
        if: always() && steps.paired_images.outcome == 'success' && steps.comparison_state.outcome == 'success'
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          baseline="$(cat "$RUNNER_TEMP/appguard-java-baseline-id")"
          closure="$(cat "$RUNNER_TEMP/appguard-java-debian-closure-id")"
          set +e
          python3 scripts/qualification/scan_diagnostic_images.py \
            --image "$baseline" --image "$closure" --platform "linux/$APPGUARD_ARCH" \
            --docker-context default --output "$RUNNER_TEMP/appguard-java-comparison/scan"
          result=$?
          set -e
          if (( result > 1 )); then exit "$result"; fi
      - name: Bind same-image diagnostic observations
        if: always() && steps.paired_images.outcome == 'success' && steps.comparison_state.outcome == 'success'
        env:
          APPGUARD_ARCH: ${{ matrix.arch }}
        run: |
          case "$APPGUARD_ARCH" in amd64|arm64) ;; *) exit 2 ;; esac
          python3 scripts/qualification/java_runtime_dependencies.py compare \
            --input "$RUNNER_TEMP/appguard-java-comparison" --output "$RUNNER_TEMP/appguard-java-comparison/bound" \
            --baseline-image "$(cat "$RUNNER_TEMP/appguard-java-baseline-id")" \
            --closure-image "$(cat "$RUNNER_TEMP/appguard-java-debian-closure-id")" --platform "linux/$APPGUARD_ARCH"
      - name: Retain sanitized diagnostic findings only
        if: always() && steps.comparison_state.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-diagnostic-findings-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/appguard-java-comparison/native/baseline/java-runtime.json
            ${{ runner.temp }}/appguard-java-comparison/native/debian-closure/java-runtime.json
            ${{ runner.temp }}/appguard-java-comparison/scan/diagnostic.json
            ${{ runner.temp }}/appguard-java-comparison/bound/comparison.json
          if-no-files-found: error
          retention-days: 7
