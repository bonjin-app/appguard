name: Verify SDK foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  server:
    name: Python, Node and Java with disposable Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2.16-alpine@sha256:35011bb2d34be3185c72935a847f25da61094c8a0a207ee17db6a7f8c3de9eb1
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          enable-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Disable persistence on the fresh test Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET save ""
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendonly no
      - name: Core suites, packages and cross-process replay
        env:
          APPGUARD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: bash scripts/test-server-sdks.sh
      - name: Hash-locked Python wheel and clean consumer
        run: |
          python3 .github/tests/test_python_package.py --verify-packaging \
            --uv "$(command -v uv)" --python "$(command -v python3)" \
            --evidence "$RUNNER_TEMP/appguard-python-package" -v
      - name: Retain fixed-schema Python packaging receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-verification-${{ github.sha }}
          path: ${{ runner.temp }}/appguard-python-package/receipt.json
          if-no-files-found: warn
          retention-days: 7

  extended-server:
    name: Go race/vet, .NET and PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2.16-alpine@sha256:35011bb2d34be3185c72935a847f25da61094c8a0a207ee17db6a7f8c3de9eb1
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APPGUARD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Isolate .NET CLI home before setup
        run: |
          printf 'DOTNET_CLI_HOME=%s/appguard-dotnet-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'APPGUARD_DOTNET_CLI_HOME=%s/appguard-dotnet-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5.11
          extensions: openssl, phar, iconv, redis-6.3.0
          tools: composer:2.10.3
          coverage: none
        env:
          fail-fast: true
      - name: Disable persistence on the fresh extended test Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET save ""
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendonly no
      - name: Runner lifecycle and failure propagation
        run: |
          python3 .github/tests/test_extended_runner.py -v
          python3 .github/tests/test_verify_workflow.py -v
      - name: Frozen dependency verification and SDK suites
        run: bash scripts/test-extended-server-sdks.sh

      - name: Actual pinned ext-redis independent-process integration
        run: |
          redis_module="$(php -n -r 'echo ini_get("extension_dir"), "/redis.", PHP_SHLIB_SUFFIX;')"
          [[ "$redis_module" = /* && -f "$redis_module" && -r "$redis_module" ]] || { echo 'Expected readable redis module in absolute PHP extension_dir' >&2; exit 1; }
          php_redis_args=(-n)
          # Packaged phpredis can link these optional serializers even when our
          # raw-command adapter uses neither. Load installed dependencies first.
          for serializer in igbinary msgpack; do
            serializer_module="$(php -n -r 'echo ini_get("extension_dir"), "/", $argv[1], ".", PHP_SHLIB_SUFFIX;' -- "$serializer")"
            if [[ "$serializer_module" = /* && -f "$serializer_module" && -r "$serializer_module" ]]; then
              php_redis_args+=(-d "extension=$serializer_module")
              case "$serializer" in igbinary) serializer_env=IGBINARY ;; msgpack) serializer_env=MSGPACK ;; esac
              printf 'APPGUARD_PHP_%s_EXTENSION=%s\n' "$serializer_env" "$serializer_module" >> "$GITHUB_ENV"
            fi
          done
          php_redis_args+=(-d "extension=$redis_module")
          php "${php_redis_args[@]}" -r 'exit(phpversion("redis") === "6.3.0" ? 0 : 1);'
          python3 sdk/php/tests/redis_integration.py php "${php_redis_args[@]}"
          printf 'APPGUARD_PHP_REDIS_EXTENSION=%s\n' "$redis_module" >> "$GITHUB_ENV"
      - name: Frozen Python dependencies and cross-language extended replay
        run: |
          uv sync --locked --project sdk/python
          uv run --frozen --project sdk/python python scripts/check_cross_sdk_replay.py --extended-only

  operational-qualification:
    name: Owned Redis resilience and bounded adversarial qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          enable-cache: false
      - name: Frozen qualification dependencies
        run: uv sync --locked --project sdk/python
      - name: Build owned Redis 7.2.16 from checksum-pinned source
        run: |
          redis_state="$(mktemp -d "$RUNNER_TEMP/appguard-redis-source.XXXXXX")"
          trap 'rm -rf -- "$redis_state"' EXIT
          redis_archive="$redis_state/redis-7.2.16.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$redis_archive" https://download.redis.io/releases/redis-7.2.16.tar.gz
          python3 - "$redis_archive" <<'PYTHON'
          import hashlib, pathlib, sys
          expected = '960a8ec15e34ff40e57ff16837b26b33bd81f2da6d24497bb63de532a323a18e'
          if hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() != expected:
              sys.exit('Redis source checksum mismatch')
          PYTHON
          tar -xzf "$redis_archive" -C "$redis_state"
          make -C "$redis_state/redis-7.2.16" -j2 MALLOC=libc redis-server
          owned_runtime="$RUNNER_TEMP/appguard-redis-owned"
          mkdir "$owned_runtime"
          install -m 755 "$redis_state/redis-7.2.16/src/redis-server" "$owned_runtime/redis-server"
          printf 'APPGUARD_REDIS_SERVER=%s/redis-server\n' "$owned_runtime" >> "$GITHUB_ENV"
      - name: Qualification regressions and release tooling safety
        run: |
          uv run --frozen --project sdk/python python .github/tests/test_replay_qualification.py -v
          uv run --frozen --project sdk/python python .github/tests/test_adversarial_qualification.py -v
          python3 -m unittest discover -s scripts/release/tests -v
          python3 .github/tests/test_verify_workflow.py -v
          uv run --frozen --project sdk/python python .github/tests/test_spring_qualification.py -v
          python3 .github/tests/test_spring_runtime_scan.py -v
      - name: Bounded owned replay load and adversarial mutation evidence
        run: |
          uv run --frozen --project sdk/python python scripts/qualification/replay_resilience.py --redis-server "$APPGUARD_REDIS_SERVER" --iterations 1000 --concurrency 16 > "$RUNNER_TEMP/appguard-replay-qualification.json"
          uv run --frozen --project sdk/python python scripts/qualification/adversarial_profile.py --iterations 10000 > "$RUNNER_TEMP/appguard-adversarial-qualification.json"
      - name: Packaged Spring mTLS ingress qualification and actual container graph scan
        run: |
          uv run --frozen --project sdk/python python scripts/qualification/spring_ingress.py --redis-server "$APPGUARD_REDIS_SERVER" --soak-seconds 30 --soak-concurrency 8 --output "$RUNNER_TEMP/appguard-spring-qualification"
          python3 scripts/qualification/scan_spring_runtime.py --qualification "$RUNNER_TEMP/appguard-spring-qualification" --output "$RUNNER_TEMP/appguard-spring-runtime-scan"
          python3 scripts/release/license_materials.py --artifacts "$RUNNER_TEMP/appguard-spring-qualification/maven-runtime" --manifest "$RUNNER_TEMP/appguard-spring-qualification/maven-runtime-manifest.json" --output "$RUNNER_TEMP/appguard-spring-license-materials" > "$RUNNER_TEMP/appguard-spring-license-summary.json"
      - name: Retain synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operational-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/appguard-replay-qualification.json
            ${{ runner.temp }}/appguard-adversarial-qualification.json
            ${{ runner.temp }}/appguard-spring-qualification/receipt.json
            ${{ runner.temp }}/appguard-spring-runtime-scan/status.json
            ${{ runner.temp }}/appguard-spring-license-summary.json
          if-no-files-found: warn
          retention-days: 7

  javascript-clients:
    name: CLI and Expo TypeScript/package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - name: CLI tests and local package
        run: |
          npm --prefix tools/cli test
          npm pack ./tools/cli --pack-destination "$RUNNER_TEMP"
      - name: Expo frozen install, tests, types and relocated package
        run: |
          npm --prefix sdk/expo ci --ignore-scripts
          npm --prefix sdk/expo test
          npm --prefix sdk/expo run typecheck
          npm --prefix sdk/expo run verify:pack

  apple:
    name: Apple Swift host tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report runner toolchain and test Swift package
        run: |
          xcodebuild -version
          swift --version
          swift test --package-path sdk/apple
