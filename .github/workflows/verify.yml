name: Verify SDK foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  server:
    name: Python, Node and Java with disposable Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2.10
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.3
          enable-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Disable persistence on the fresh test Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET save ""
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendonly no
      - name: Core suites, packages and cross-process replay
        env:
          APPGUARD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: bash scripts/test-server-sdks.sh

  extended-server:
    name: Go race/vet, .NET and PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Isolate .NET CLI home before setup
        run: |
          printf 'DOTNET_CLI_HOME=%s/appguard-dotnet-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'APPGUARD_DOTNET_CLI_HOME=%s/appguard-dotnet-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5.11
          extensions: openssl, phar, iconv
          tools: composer:2.10.3
          coverage: none
      - name: Runner lifecycle and failure propagation
        run: python3 .github/tests/test_extended_runner.py -v
      - name: Frozen dependency verification and SDK suites
        run: bash scripts/test-extended-server-sdks.sh

  javascript-clients:
    name: CLI and Expo TypeScript/package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - name: CLI tests and local package
        run: |
          npm --prefix tools/cli test
          npm pack ./tools/cli --pack-destination "$RUNNER_TEMP"
      - name: Expo frozen install, tests, types and relocated package
        run: |
          npm --prefix sdk/expo ci --ignore-scripts
          npm --prefix sdk/expo test
          npm --prefix sdk/expo run typecheck
          npm --prefix sdk/expo run verify:pack

  apple:
    name: Apple Swift host tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report runner toolchain and test Swift package
        run: |
          xcodebuild -version
          swift --version
          swift test --package-path sdk/apple
